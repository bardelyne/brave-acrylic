name: Brave compatibility data

on:
  schedule:
    # GitHub schedules are best-effort. A staggered backup compensates for
    # dropped primary runs; unchanged releases skip all binary downloads.
    - cron: '17 */2 * * *'
    - cron: '47 */2 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Stable Brave tag to backfill (blank selects the latest stable release)
        type: string
        default: ''
      force:
        description: Regenerate an existing release record
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/compatibility.yml'
      - 'tools/**'
      - 'tests/**'
      - 'brave-acrylic.wh.cpp'

permissions:
  contents: read

concurrency:
  group: brave-symbol-cache-v1
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'bardelyne/brave-acrylic' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      artifact: ${{ steps.trusted.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Immutable extractor, tests and tools. Editing main cannot replace
          # trusted generation code without changing this workflow's hash.
          ref: 526df5a5c0fddd16bdbfe4f628d1a6a28266234e
          persist-credentials: false
      - name: Record requested and actual schedule times
        env:
          REQUESTED_SCHEDULE: ${{ github.event.schedule }}
        run: node -e 'console.log("Requested cron:", process.env.REQUESTED_SCHEDULE || "manual/push", "Actual start UTC:", new Date().toISOString())'
      - name: Test the data extractor
        run: node --test tests/*.test.cjs
      - name: Check the official stable release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BRAVE_TAG: ${{ inputs.tag }}
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: node tools/update-compatibility.cjs prepare
      - name: Extract and validate each native feature
        if: steps.plan.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/update-compatibility.cjs build
      - name: Inspect unsupported compiler output using the existing downloads
        if: failure() && steps.plan.outputs.needed == 'true'
        continue-on-error: true
        run: node tools/research-compiler.cjs --existing "$RUNNER_TEMP/brave-compatibility/chrome.dll" "$RUNNER_TEMP/brave-compatibility/chrome.dll.pdb" "$RUNNER_TEMP/brave-compatibility/diagnostics"
      - name: Preserve small failure diagnostics
        if: failure() && steps.plan.outputs.needed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compiler-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/brave-compatibility/diagnostics/
          if-no-files-found: warn
          retention-days: 14
      - name: Independently validate the small artifact
        if: steps.plan.outputs.needed == 'true'
        run: node tools/update-compatibility.cjs verify
      - name: Record immutable raw-cache digest on GitHub
        if: steps.plan.outputs.needed == 'true'
        id: trusted
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/brave-compatibility/trusted/pdb_*.txt
          archive: false
          if-no-files-found: error
          retention-days: 90
      - name: Transfer the small generated files
        if: steps.plan.outputs.needed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windhawk-symbol-cache-v1
          path: |
            ${{ runner.temp }}/brave-compatibility/out/cache.txt
            ${{ runner.temp }}/brave-compatibility/out/record.json
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: generate
    if: needs.generate.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 526df5a5c0fddd16bdbfe4f628d1a6a28266234e
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windhawk-symbol-cache-v1
          path: ${{ runner.temp }}/brave-compatibility/out/
      - name: Validate and publish data only
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_ARTIFACT_ID: ${{ needs.generate.outputs.artifact }}
        run: node tools/update-compatibility.cjs publish
